# CI + release pipeline for GeneratorPi.
#
#  * push/PR to main  -> run the full test suite. On main pushes, additionally regenerate
#    manifest.json (the in-app updater verifies downloaded files against it) and refresh the
#    coverage badge, committing them back with a [skip ci] marker so the auto-commit doesn't
#    re-trigger the workflow.
#  * push a vX.Y.Z tag -> the `release` job runs: verify the VERSION file matches the tag, gate on
#    the test suite, verify manifest.json matches the shipped files, then PUBLISH a GitHub Release
#    whose notes are the CHANGELOG.md section for that version. No manual `gh release create`.
#
#  Cutting a release is therefore just:
#     1) edit CHANGELOG.md (add the "## X.Y.Z" section) + bump VERSION
#     2) commit + push main            (the push run regenerates + commits manifest.json)
#     3) git tag vX.Y.Z && git push origin vX.Y.Z   (this job publishes the Release automatically)
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write            # commit the regenerated manifest/badge on push; create Releases on tag

jobs:
  test:
    runs-on: ubuntu-latest
    # Branch pushes + PRs only (tag pushes go to `release`). Skip the workflow's own auto-commits
    # (they carry [skip ci]).
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Run tests with coverage (gate)
        run: |
          python -m pytest tests/ --cov=generator_control \
            --cov-report=json:.cov.json --cov-report=term -q

      - name: Regenerate manifest.json
        run: python tools/gen-manifest.py

      - name: Refresh coverage badge
        if: github.event_name == 'push'
        run: |
          pct=$(python -c "import json;print(round(json.load(open('.cov.json'))['totals']['percent_covered']))")
          if   [ "$pct" -ge 90 ]; then color=brightgreen
          elif [ "$pct" -ge 75 ]; then color=yellow
          else color=red; fi
          mkdir -p .github/badges
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$pct" "$color" > .github/badges/coverage.json
          echo "coverage: ${pct}%"

      - name: Commit manifest + badge if changed
        if: github.event_name == 'push'
        run: |
          rm -f .cov.json                       # don't commit the raw coverage data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "manifest + badge already up to date"
          else
            git commit -m "ci: regenerate manifest + coverage badge [skip ci]"
            git push
          fi

  release:
    # Fires only for vX.Y.Z tag pushes: gate + consistency checks, then publish the GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest

      - name: Derive version from the tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: VERSION file must match the tag
        run: |
          disk="$(tr -d '[:space:]' < VERSION)"
          want="${{ steps.ver.outputs.v }}"
          if [ "$disk" != "$want" ]; then
            echo "::error::VERSION file ($disk) does not match tag ($want) -- bump VERSION before tagging"
            exit 1
          fi
          echo "VERSION $disk matches tag"

      - name: Run tests (release gate)
        run: python -m pytest tests/ -q

      - name: manifest.json must match the shipped files
        run: |
          python tools/gen-manifest.py
          if ! git diff --quiet manifest.json; then
            echo "::error::manifest.json is stale on this tag -- it must be regenerated + committed on main before tagging"
            git --no-pager diff manifest.json
            exit 1
          fi
          echo "manifest.json matches all shipped files"

      - name: Extract this version's CHANGELOG notes
        run: |
          awk -v ver="## ${{ steps.ver.outputs.v }}" '
            $0 == ver {flag=1; next}      # start after the matching "## X.Y.Z" heading
            /^## / && flag {flag=0}        # stop at the next version heading
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG.md section found for ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "----- release notes -----"; cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "GeneratorPi $GITHUB_REF_NAME" \
            --notes-file notes.md
